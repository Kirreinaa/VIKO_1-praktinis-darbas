<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">          <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <h1>VYBE</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="outfits.html">Outfits</a>
                <a href="book.html">Book a stylist</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <main>
            <div class="booking-container">
            <section class="booking-info">
                <h2>Find your VYBE</h2>

                <p>
                    Not sure what to wear? Our stylist will help you create
                    an outfit that fits your personality, occasion and budget.
                </p>

                <p>
                    Fill out the form below and we will contact you by email
                    within two business days.
                </p>
            </section>

            <section class="booking-form">
                <label for="name">How should we call you?</label>
                <input type="text" id="name" placeholder="Your name">

                <label for="email">Your Email:</label>
                <input type="text" id="email" placeholder="Email">

                <label for="budget">What is your budget?</label>
                <select id="budget">
                    <option>under $50</option>
                    <option>$50-100$</option>
                    <option>$100-150$</option>
                    <option>$150+</option>

                </select>
                <button class="book-button" type="submit"> BOOK NOW </button>
            </section>
            </div>
        </main>


        <footer>
            <h1>Contacts</h1>
        </footer>

    </body>

</html>
