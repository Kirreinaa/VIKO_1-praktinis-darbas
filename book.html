<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">          
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <header>
            <h1>✦ VYBE</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="outfits.html">Outfits</a>
                <a href="book.html">Book a stylist</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <main>
            <div class="booking-container">
                <h2 class="book-title">Find your VYBE</h2>
                <section class="booking-info">
                        <p>
                            Not sure what to wear? Our stylist will help you create
                            an outfit that fits your personality, occasion and budget.
                        </p>

                        <p>
                            Fill out the form below and we will contact you by email
                            within two business days.
                        </p>
                </section>

                <div class="booking-cards">

                <section class="booking-form">

                    <div class="form-row">

                        <div class="form-field">
                            <label for="name">Your name:</label>
                            <input class="text-input" type="text" id="name" placeholder="Enter your name">
                        </div>

                        <div class="form-field">
                            <label for="email">Your Email:</label>
                            <input class="text-input" type="text" id="email" placeholder="Enter your email">
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-field">
                            <label for="budget">What is your budget?</label>
                            <select class="select-options" id="budget">
                                <option>under $50</option>
                                <option>$50-100$</option>
                                <option>$100-150$</option>
                                <option>$150+</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="outfit-style">How do you want your outfit to feel?</label>
                            <select class="select-options" id="outfit-style">
                                <option>Bold & edgy</option>
                                <option>Soft & dreamy</option>
                                <option>Y2K & playful</option>
                                <option>Simple & clean</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-field">
                            <label>Tell us about yourself</label>
                            <input class="big-text-input" type="text" id="about-yourself" placeholder="For example: I'm going to a concert, I prefer dark colors, I need something casual...">
                    </div>

                    <button class="book-button" type="submit">BOOK NOW</button>

                </section>

                    <aside class="booking-aside">
                        why booking with VYBE?
                    </aside>

                </div>

            </div>
        </main>


        <footer>
            <h1>Contacts</h1>
        </footer>

    </body>

</html>
